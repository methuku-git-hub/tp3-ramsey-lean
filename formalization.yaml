fidelity:
  divergences: >-
    The Ramsey number is expressed as a quantified coloring property on Fin N,
    with an independent set of exactly t vertices. All logarithms are natural.
    The class experiment uses independent Bernoulli trials with the required
    conditional acceptance probabilities. Joint probabilities and shared-mark
    errors are proved for that experiment. Conflict deletion fixes one endpoint
    of each conflicting pair and uses the larger constants 3 and 162, whose
    numerical specialization is proved. Dense block occurrences carry disjoint
    charged edge sets. The sufficient general degree bound is 3n rather than n.
    The final integer k is maximal subject to exp(k^60) at most sqrt(3n),
    instead of using a real-root floor formula. These adjustments change only
    constants and thresholds. No theorem hypothesis is added.
