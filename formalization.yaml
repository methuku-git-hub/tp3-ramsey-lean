version: "v0.4"
project:
  name: "On the Ramsey number of a tight path of length 3 versus a clique"
  description: >-
    Let r(P_s,t) denote the Ramsey number of the 3-uniform tight path with
    s edges versus a clique on t vertices. Results of Phelps and Rodl give
    r(P_2,t)=Theta(t^2/log t). In 2013, Cooper and Mubayi proved that
    r(P_s,t)=Theta(t^2) for every fixed s at least 4. For the remaining
    case s=3, they asked for the order of r(P_3,t), a question later
    reiterated by Bohman, Mubayi and Picollelli. Together, these results
    give a lower bound of Omega(t^2/log t) and an upper bound of O(t^2)
    for r(P_3,t). We improve the upper bound to O(t^2/log log t), confirming
    the subquadratic growth predicted by Mattheus, Mubayi, Nie and Verstraëte.
    The main upper bound is formalized unconditionally in Lean 4.
  authors: ["Abhishek Methuku"]
  responsible_maintainers: ["Abhishek Methuku"]
  license: "Apache-2.0"
